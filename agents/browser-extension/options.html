<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Laptop Monitoring instellingen</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; color: #1e293b; }
    label { display: block; margin-top: 16px; font-weight: 600; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { margin-top: 20px; padding: 8px 16px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; }
    .note { margin-top: 24px; padding: 12px; background: #f5f3ff; border-radius: 8px; font-size: 13px; }
    #status { margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>💻 Laptop Monitoring</h1>

  <label for="serverUrl">Server-URL</label>
  <input id="serverUrl" placeholder="http://localhost:8000">

  <label for="token">Apparaat-token (van je laptop)</label>
  <input id="token" type="password" placeholder="token van de pagina Apparaten">

  <button id="save">Opslaan en testen</button>
  <div id="status"></div>

  <div class="note">
    <strong>Incognito bijhouden:</strong> open <code>chrome://extensions</code> (of <code>edge://extensions</code>),
    klik bij deze extensie op <em>Details</em> en zet <em>Toestaan in incognito</em> aan.
  </div>

  <script src="options.js"></script>
</body>
</html>
